name: Fork container package

on:
  push:
    branches: [feature/admin-usage-and-bark]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'hrz6976/codex-lb'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fork image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hrz6976/codex-lb:fork
            ghcr.io/hrz6976/codex-lb:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/hrz6976/codex-lb
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hrz6976-fork
          cache-to: type=gha,mode=max,scope=hrz6976-fork
